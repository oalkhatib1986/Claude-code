<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>SAK Family Cash Flow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap">
<style id="css">
/* Layout: sticky top bar, A4-landscape "sheets" for summary pages, fluid editable tables for detail pages. */
:root{
  --ink:#1D1D1F; --muted:#5F5E5A; --faint:#8C8A84; --line:#E4E2DC; --ground:#E9E6DF; --paper:#F6F5F2; --card:#FFFFFF;
  --gold:#F2B33D; --coral:#F28B6A; --rust:#B8432F; --cobalt:#2B57A0; --pink:#E5486B; --mint:#3FD39A;
  --neg:#9A3520; --negbg:#FBE3DA; --pos:#0D6B47; --posbg:#E4F5EC; --focus:#2B57A0;
  --font:'Bricolage Grotesque', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:var(--paper)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px}
.brand{display:flex;flex-direction:column;text-decoration:none;flex-shrink:0}
.brand b{font-size:17px;font-weight:800;letter-spacing:-.01em}
.brand span{font-size:12px;color:#BDBBB4}
.nav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:8px 12px;border-radius:999px;text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap;color:#D9D7D0}
.nav a:hover{background:#333336;color:#fff}
.nav a.on{background:var(--paper);color:var(--ink)}
.nav a .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-ink{background:var(--ink);color:var(--paper)}
.btn-line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn-ghost{background:transparent;color:var(--ink);padding:8px 12px}
.btn-danger{background:var(--rust);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}

/* page */
.main{max-width:1240px;margin:0 auto;padding-block:18px 120px;padding-inline:20px}
.crumbs{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.crumbs .back{background:var(--card);border:0;border-radius:999px;padding:7px 14px 7px 10px;font-weight:700;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.crumbs .path{font-size:14px;color:var(--muted)}
.crumbs .path a{color:var(--muted)}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.ph h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.05;text-wrap:balance}
.ph .kick{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.ph .big{font-size:30px;font-weight:800;letter-spacing:-.02em}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);align-self:center;margin-right:4px;min-width:74px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:var(--card);text-decoration:none;font-weight:600;font-size:14px}
.chip.on{background:var(--ink);color:var(--paper)}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.card{background:var(--card);border-radius:20px;padding:18px 20px}
.card h2{margin:0 0 10px;font-size:15px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{border-radius:18px;padding:14px 16px;background:var(--card);text-decoration:none;display:block}
.stat .l{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
a.stat:hover{box-shadow:inset 0 0 0 2px var(--ink)}
.stack{display:flex;flex-direction:column;gap:14px}
.muted{color:var(--muted)}
.empty{padding:22px;text-align:center;color:var(--muted)}
@media (max-width:820px){.grid2{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.ph h1{font-size:28px}.brand span{display:none}}

/* tables */
.tbl-wrap{overflow-x:auto;background:var(--card);border-radius:20px}
.tbl{border-collapse:separate;border-spacing:0;width:100%;min-width:1180px;font-size:14px}
.tbl th{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:12px 8px 8px;border-bottom:2px solid var(--ink);white-space:nowrap;background:var(--card)}
.tbl th.l,.tbl td.l{text-align:left;white-space:nowrap}
.tbl td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle;background:var(--card)}
.tbl .c-name{position:sticky;left:0;z-index:1;min-width:300px;max-width:340px;text-align:left;padding-left:16px}
.tbl th.c-name{z-index:2}
.tbl td.c-name{box-shadow:1px 0 0 var(--line)}
.tbl .nm{display:flex;align-items:center;gap:10px}
.tbl .nm a{font-weight:600;text-decoration:none}
.tbl .nm a:hover{text-decoration:underline}
.tbl .meta{font-size:12px;color:var(--muted);margin-left:28px;margin-top:-2px}
.tbl tr.grp td{background:var(--paper);font-weight:800;padding-top:10px;padding-bottom:8px;border-bottom:1px solid var(--ink)}
.tbl tr.grp td a{text-decoration:none}
.tbl tr.grp td a:hover{text-decoration:underline}
.tbl tr.off td{color:var(--faint)}
.tbl tr.off .cell{color:var(--faint);text-decoration:line-through}
.tbl tfoot td{font-weight:800;border-top:2px solid var(--ink);border-bottom:0;padding-top:10px;padding-bottom:12px}
.tbl tfoot a{text-decoration:none}
.tbl tfoot a:hover{text-decoration:underline}
.tbl .tot{font-weight:700;background:#FAF9F6}
.cell{width:92px;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 6px;text-align:right;font-variant-numeric:tabular-nums}
.cell:hover{border-color:var(--line);background:#FBFAF7}
.cell:focus{border-color:var(--focus);background:#fff;outline:none;box-shadow:0 0 0 3px rgba(43,87,160,.18)}
.cell::placeholder{color:#B9B7B0}
.chk{width:18px;height:18px;accent-color:var(--ink);flex-shrink:0;cursor:pointer}
.cdot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}
.tbl-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted)}

/* forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label,.fld .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.inp{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;min-width:0;width:100%}
.inp:focus{border-color:var(--focus);outline:none}
.inp.big{font-size:26px;font-weight:800;letter-spacing:-.02em;padding:8px 12px}
textarea.inp{min-height:84px;resize:vertical;line-height:1.45}
.months{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px}
.months .fld .inp{text-align:right;padding:10px 8px}
.sw{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--negbg);color:var(--neg);border-radius:14px;padding:10px 14px;font-weight:600}
@media (max-width:820px){.form{grid-template-columns:1fr}.months{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* save bar + toast */
.savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--paper);border-radius:999px;padding:8px 8px 8px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.savebar .msg{font-weight:600;font-size:14px}
.savebar .btn-ghost{color:var(--paper)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:31;background:#fff;color:var(--ink);border-radius:14px;padding:10px 16px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.18);max-width:calc(100% - 32px)}

/* sheets: fixed A4 landscape canvases, scaled to fit in the app */
.sheet-wrap{width:100%;max-width:1123px;margin:0 auto;position:relative}
.sheet{width:1123px;height:794px;transform-origin:top left;background:var(--paper);color:var(--ink);font-family:var(--font);padding:34px 40px 30px;display:flex;flex-direction:column;gap:14px;overflow:hidden;border-radius:6px;box-shadow:0 2px 14px rgba(29,29,31,.12)}
.sheet-wrap .sheet{position:absolute;left:0;top:0}
#pdf-stage{position:absolute;left:-30000px;top:0;width:1123px}
#pdf-stage .sheet{border-radius:0;box-shadow:none}
.sheet .lk{text-decoration:none;border-radius:6px}
.sheet a.lk:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.sh-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.sh-head h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.02em}
.sh-head .r{display:flex;gap:14px;align-items:baseline;font-size:15px;font-weight:500;color:var(--muted)}
.pill{font-size:15px;font-weight:700;padding:4px 12px;border-radius:999px}
.t{border-radius:22px;padding:16px 20px;display:flex;flex-direction:column;overflow:hidden;position:relative;text-decoration:none}
.tl{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.code{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:2px 0}
.kv b{font-weight:800}
.sp{display:flex;align-items:flex-end;gap:4px;height:28px;margin-top:auto}
.sp .sb{flex:1;border-radius:3px 3px 0 0;display:block}
.spl{display:flex;gap:4px;margin-top:3px}
.spl span{flex:1;text-align:center;font-size:10px;font-weight:700;opacity:.75}
.strip{display:flex;flex-grow:1;align-items:flex-end}
.mc{flex:1;display:flex;flex-direction:column;align-items:center;text-decoration:none;border-radius:12px;padding:4px 0}
a.mc:hover{background:var(--paper)}
.pair{display:flex;align-items:flex-end;gap:3px}
.bi{width:14px;background:var(--ink);border-radius:3px 3px 0 0}
.bo{width:14px;background:var(--coral);border-radius:3px 3px 0 0}
.npill{font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px;margin-top:5px}
.ev{font-size:11px;font-weight:700;height:14px;margin-bottom:2px;white-space:nowrap;color:#8A6200}
.legend{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.br{display:grid;grid-template-columns:170px minmax(0,1fr) 110px;align-items:center;column-gap:14px;padding:7px 0;border-top:1px solid var(--line);font-size:15px;text-decoration:none}
a.br:hover .brn{text-decoration:underline}
.track{height:14px;background:#F0EEE8;border-radius:7px;overflow:hidden}
.fill{height:100%;border-radius:7px}
/* sheet tables (PDF detail pages) */
.st-row{display:grid;grid-template-columns:250px 150px repeat(8,minmax(0,1fr)) 100px;align-items:center;height:22px;font-size:12.5px;border-bottom:1px solid var(--line)}
.st-row>div{padding-right:8px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-row>div:first-child,.st-row>div:nth-child(2){text-align:left;padding-left:6px}
.st-row.h{height:30px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--ink)}
.st-row.g{font-weight:800;height:26px;border-bottom:1px solid var(--ink)}
.st-row.f{font-weight:800;height:30px;background:var(--ink);color:var(--paper);border:0;border-radius:8px;margin-top:6px}
.st-row .z{color:#A9A79F}
</style>
<div id="app"></div>
<div id="pdf-stage" aria-hidden="true"></div>
